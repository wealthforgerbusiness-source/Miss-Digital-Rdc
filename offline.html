<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hors ligne – Miss Digital RDC</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#182B5F">
  <link rel="icon" href="/assets/icons/favicon-48.png" sizes="48x48">
  <style>
    *{box-sizing:border-box}
    html,body{height:100%;margin:0}
    body{
      font-family:"Cabin",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
      color:#1b2240;background:radial-gradient(900px 420px at 80% -10%,#fdeaf2 0%,transparent 60%),#fff;
      display:grid;place-items:center;padding:24px;text-align:center;-webkit-font-smoothing:antialiased
    }
    main{max-width:420px;display:grid;gap:14px;justify-items:center}
    img{width:150px;height:auto;border-radius:50%;box-shadow:0 10px 30px rgba(24,43,95,.14)}
    h1{margin:6px 0 0;font-size:28px;line-height:1.15;color:#182b5f}
    p{margin:0;color:#5b6483;font-size:17px;line-height:1.55}
    button{
      margin-top:8px;min-height:52px;padding:0 30px;border:0;border-radius:999px;cursor:pointer;
      font:inherit;font-weight:700;font-size:17px;color:#fff;
      background:linear-gradient(135deg,#182b5f,#2a4194);box-shadow:0 8px 20px rgba(24,43,95,.28)
    }
    button:active{transform:scale(.97)}
    small{color:#8a92ad}
  </style>
</head>
<body>
  <main>
    <img src="/assets/logo.png" alt="Miss Digital RDC" width="150" height="150">
    <h1>Vous êtes hors ligne</h1>
    <p>Impossible de charger les candidates et le classement sans connexion internet. Vérifiez votre réseau, puis réessayez.</p>
    <button type="button" onclick="location.reload()">Réessayer</button>
    <small>Les votes nécessitent une connexion pour le paiement mobile money.</small>
  </main>
  <script>
    window.addEventListener("online", function () { location.reload(); });
  </script>
</body>
</html>

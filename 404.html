<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page introuvable – Miss Digital RDC</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#182B5F">
  <link rel="icon" href="/assets/icons/favicon-48.png" sizes="48x48">
  <style>
    *{box-sizing:border-box}
    html,body{height:100%;margin:0}
    body{
      font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
      color:#1b2240;background:radial-gradient(900px 420px at 80% -10%,#fdeaf2 0%,transparent 60%),#fff;
      display:grid;place-items:center;padding:24px;text-align:center
    }
    main{max-width:420px;display:grid;gap:14px;justify-items:center}
    img{width:130px;height:auto;border-radius:50%;box-shadow:0 10px 30px rgba(24,43,95,.14)}
    h1{margin:6px 0 0;font-size:64px;line-height:1;color:#182b5f}
    p{margin:0;color:#5b6483;font-size:18px;line-height:1.5}
    a{
      margin-top:8px;display:inline-flex;align-items:center;min-height:52px;padding:0 30px;border-radius:999px;
      font-weight:700;font-size:17px;color:#fff;text-decoration:none;
      background:linear-gradient(135deg,#182b5f,#2a4194);box-shadow:0 8px 20px rgba(24,43,95,.28)
    }
  </style>
</head>
<body>
  <main>
    <img src="/assets/logo.png" alt="Miss Digital RDC" width="130" height="130">
    <h1>404</h1>
    <p>Cette page n'existe pas ou a été déplacée.</p>
    <a href="/">Retour à l'accueil</a>
  </main>
</body>
</html>
